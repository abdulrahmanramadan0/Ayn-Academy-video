<style>
:root{--p:#153C4D;--g:#F59E0B}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#E3E9EF;font-family:"Bahij TheSans","IBM Plex Sans Arabic",Tajawal,Tahoma,sans-serif;font-weight:800;display:grid;place-items:center;overflow:hidden}
#frame{position:relative;height:min(94vh,calc(94vw*16/9));aspect-ratio:9/16;border-radius:5cqw;overflow:hidden;box-shadow:0 30px 90px rgba(21,60,77,.35),0 0 0 8px #fff;container-type:size;background:#F8FAFC}
canvas{width:100%;height:100%;display:block}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5cqw;background:rgba(248,250,252,.93);transition:opacity .35s;padding:0 8cqw;text-align:center}
#ov.off{opacity:0;pointer-events:none}
#ov img{width:62cqw;margin-bottom:2cqw}
button{font:inherit;font-weight:800;font-size:6.2cqw;color:#fff;background:var(--p);border:0;border-radius:20cqw;padding:3cqw 9cqw;cursor:pointer;box-shadow:0 1cqw 0 var(--g);transition:transform .15s,box-shadow .15s}
button:hover{transform:translateY(-.4cqw)}button:active{transform:translateY(.8cqw);box-shadow:0 .2cqw 0 var(--g)}
button:focus-visible{outline:.6cqw solid var(--g);outline-offset:.8cqw}
button.alt{background:var(--g);color:var(--p);font-size:3.9cqw;padding:2.8cqw 5cqw;box-shadow:0 1cqw 0 var(--p);line-height:1.5}
#hint{font-size:3.2cqw;color:#1F566E;font-weight:700}
#status{position:fixed;bottom:.6vh;left:0;right:0;text-align:center;font-size:14px;color:#153C4D;font-weight:700;min-height:1.5em}
</style>

<script>
const W=1080,H=1920,P='#153C4D',P2='#1F566E',G='#F59E0B',BG='#F8FAFC';
const F='"Bahij TheSans","IBM Plex Sans Arabic",Tajawal,Tahoma,sans-serif';
const $=id=>document.getElementById(id),wait=ms=>new Promise(r=>setTimeout(r,ms));
const cv=$('cv'),ctx=cv.getContext('2d');ctx.direction='rtl';ctx.textAlign='center';ctx.textBaseline='middle';
const cl=x=>Math.min(1,Math.max(0,x));
const bez=(x1,y1,x2,y2)=>t=>{if(t<=0)return 0;if(t>=1)return 1;let a=0,b=1,m;for(let i=0;i<24;i++){m=(a+b)/2;(3*(1-m)**2*m*x1+3*(1-m)*m*m*x2+m**3)<t?a=m:b=m}m=(a+b)/2;return 3*(1-m)**2*m*y1+3*(1-m)*m*m*y2+m**3};

const rr=(x,y,w,h,r)=>{ctx.beginPath();ctx.roundRect(x,y,w,h,r)};

/* ================= Content & timeline (seconds) ================= */
const QT='ماذا سيتغير عندما يتعلم اليافع أن يسأل «لماذا؟» بطريقة أفضل؟'.split(' ');
const STEPS=['سيسأل','يحلل','يكتشف الافتراضات','يفحص الأدلة','يرى البدائل','يعيد التفكير'];
const L1T='هذه ليست معلومات يحفظها…'.split(' '),L2T='بل مهارات يمارسها'.split(' '),SUB=['تدريبية','.','تربوية','.','تعليمية'];
const S_START=[0,4.4,8.7,12.9],WIPES=[3.98,8.28,12.48],END=16.6;
let t1=.35;const T1=QT.map((w,i)=>{const t=t1;t1+=(i===7?.42:.2);return t});
const P2T=STEPS.map((_,i)=>4.65+i*.36);
const T3a=L1T.map((_,i)=>8.95+i*.24),T3blk=10.05,T3b=L2T.map((_,i)=>10.25+i*.3);

/* ================= Audio (all routed to speakers + MediaStreamDestination) ================= */
let ac,BUS,DEST,NOISE;
function initAudio(){
  if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();BUS=ac.createGain();BUS.gain.value=.9;
    BUS.connect(ac.destination);DEST=ac.createMediaStreamDestination();BUS.connect(DEST);
    NOISE=ac.createBuffer(1,ac.sampleRate*.6,ac.sampleRate);const d=NOISE.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  return ac.resume();
}
const env=(g,t,pk,dur)=>{g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(pk,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+dur)};
function osc(type,t,f0,f1,dur,pk){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur*.45);env(g,t,pk,dur);o.connect(g).connect(BUS);o.start(t);o.stop(t+dur+.05)}
const sPop=(t,f=500,v=.22)=>osc('sine',t,f*.6,f*1.8,.16,v);
const sSlam=t=>{osc('triangle',t,180,45,.35,.5);sPop(t,900,.15)};
function sSwoosh(t){const s=ac.createBufferSource();s.buffer=NOISE;const f=ac.createBiquadFilter();f.type='bandpass';f.Q.value=2;
  f.frequency.setValueAtTime(500,t);f.frequency.exponentialRampToValueAtTime(5000,t+.4);
  const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.22,t+.17);g.gain.linearRampToValueAtTime(0,t+.5);
  s.connect(f).connect(g).connect(BUS);s.start(t)}

function scheduleAudio(t0){
  const at=(t,fn)=>fn(t0+t);

  WIPES.forEach(t=>at(t,sSwoosh));
  P2T.forEach((t,i)=>at(t,a=>sPop(a,400+i*90,.25)));
  T3a.forEach(t=>at(t,a=>sPop(a,500)));at(T3blk,a=>sPop(a,300));T3b.forEach(t=>at(t,sSlam));
  at(T4.emb,a=>sPop(a,600));at(T4.name,a=>sPop(a,700));at(T4.sub,a=>sPop(a,800));at(T4.chime,sChime);
  for(let i=0;i<3;i++)at(T4.ic(i),a=>sPop(a,900,.18));
}

/* ================= Layout ================= */
function layout(words,size,maxW,gap=size*.28){
  ctx.font=`800 ${size}px ${F}`;const ws=words.map(w=>ctx.measureText(w).width);
  const lines=[];let cur=[],cw=0;
  words.forEach((w,i)=>{if(cur.length&&cw+gap+ws[i]>maxW){lines.push(cur);cur=[];cw=0}cw+=(cur.length?gap:0)+ws[i];cur.push(i)});
  lines.push(cur);
  const lh=size*1.5,Ht=lines.length*lh,pos=[];let Wm=0;
  lines.forEach((ln,li)=>{const tw=ln.reduce((s,i)=>s+ws[i],0)+gap*(ln.length-1);Wm=Math.max(Wm,tw);let x=tw/2;
    ln.forEach(i=>{pos[i]={x:x-ws[i]/2,y:-Ht/2+lh*(li+.5)};x-=ws[i]+gap})});
  return{pos,ws,W:Wm,H:Ht,size};
}
let LQ,LL1,LL2,LSUB,WS2,EMB;
function initLayout(){
  LQ=layout(QT,108,900);LL1=layout(L1T,100,900);LL2=layout(L2T,112,800);LSUB=layout(SUB,56,900,22);
  ctx.font=`800 64px ${F}`;WS2=STEPS.map(s=>ctx.measureText(s).width);
}

/* ================= Drawing ================= */
const pp=(t,d,dur=.55)=>EB(cl((t-d)/dur));
function withPop(x,y,p,fn){if(p<=0)return;ctx.save();ctx.translate(x,y);ctx.rotate(-.14*(1-Math.min(p,1)));ctx.scale(p,p);ctx.globalAlpha=Math.min(1,p*6);fn();ctx.restore()}
function words(L,txt,cx,cy,times,color,hlIdx=-1){
  ctx.font=`800 ${L.size}px ${F}`;
  L.pos.forEach((p,i)=>withPop(cx+p.x,cy+p.y,pp(...times(i)),()=>{
    if(i===hlIdx){ctx.fillStyle=G;rr(-L.ws[i]/2-32,-L.size*.56,L.ws[i]+64,L.size*1.12,L.size*.4);ctx.fill();ctx.fillStyle=P}
    else ctx.fillStyle=typeof color==='function'?color(i):color;
    ctx.fillText(txt[i],0,L.size*.04)}));
}
function background(t){
  ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=.14;ctx.fillStyle=G;ctx.beginPath();ctx.arc(110,80,280,0,7);ctx.fill();
  ctx.globalAlpha=.07;ctx.strokeStyle=P2;ctx.lineWidth=60;ctx.beginPath();ctx.arc(990,1850,230,0,7);ctx.stroke();ctx.globalAlpha=1;
  ctx.fillStyle=G;ctx.beginPath();ctx.arc(130,1660-18*(1-Math.cos(t*2.1)),40,0,7);ctx.fill();
  ctx.fillStyle=P;ctx.fillRect(0,0,W,16);ctx.fillStyle=G;ctx.fillRect(0,0,W*.4,16);
}
function scene1(t){words(LQ,QT,540,960,i=>[t,T1[i]],P,7)}
function scene2(t){
  const y0=361;
  STEPS.forEach((s,i)=>{
    const y=y0+64+i*214,w=WS2[i]+128,gold=i%2;
    withPop(540,y,pp(t,P2T[i]),()=>{
      ctx.fillStyle=gold?'rgba(245,158,11,.28)':'rgba(21,60,77,.18)';rr(-w/2,-50,w,128,64);ctx.fill();
      ctx.fillStyle=gold?G:P;rr(-w/2,-64,w,128,64);ctx.fill();
      ctx.font=`800 64px ${F}`;ctx.fillStyle=gold?P:'#fff';ctx.fillText(s,0,4)});
    if(i<5)withPop(540,y+107,pp(t,P2T[i]+.18,.45),()=>{
      ctx.strokeStyle=G;ctx.lineWidth=11;ctx.lineCap=ctx.lineJoin='round';
      ctx.beginPath();ctx.moveTo(0,-24);ctx.lineTo(0,24);ctx.moveTo(-20,6);ctx.lineTo(0,26);ctx.lineTo(20,6);ctx.stroke()});
  });
}
function scene3(t){
  words(LL1,L1T,540,720,i=>[t,T3a[i]],P);
  const bw=LL2.W+110,bh=LL2.H+50,cy=1150;
  withPop(540,cy,pp(t,T3blk,.5),()=>{
    ctx.fillStyle=G;rr(-bw/2+14,-bh/2+14,bw,bh,40);ctx.fill();
    ctx.fillStyle=P;rr(-bw/2,-bh/2,bw,bh,40);ctx.fill()});
  words(LL2,L2T,540,cy,i=>[t,T3b[i]],'#fff');
}
const ICONS=[
 ['M8 3h8a5 5 0 0 1 5 5v8a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5V8a5 5 0 0 1 5-5z','M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0z','M17.3 6.7h.01'].map(d=>new Path2D(d)),
 ['M14 8h3V4h-3a4 4 0 0 0-4 4v3H7v4h3v6h4v-6h3l1-4h-4V8z'].map(d=>new Path2D(d)),
 ['M3 21l1.6-4.6A8.5 8.5 0 1 1 8 19.6z','M9 8.5c0 3.5 3 6.5 6.5 6.5l1-1.5-2-1-1 .8a4 4 0 0 1-2-2l.8-1-1-2z'].map(d=>new Path2D(d))];
function scene4(t){
  const eh=190,ew=EMB.width/EMB.height*eh;
  withPop(540,640,pp(t,T4.emb),()=>ctx.drawImage(EMB,-ew/2,-eh/2,ew,eh));
  withPop(540,880,pp(t,T4.name),()=>{ctx.font=`800 150px ${F}`;ctx.fillStyle=P;ctx.fillText('أكاديمية عين',0,6)});
  words(LSUB,SUB,540,1020,()=>[t,T4.sub],i=>i%2?G:P2);
  for(let i=0;i<3;i++)withPop(540+154*(1-i),1260,pp(t,T4.ic(i)),()=>{
    ctx.fillStyle=P;ctx.beginPath();ctx.arc(0,0,60,0,7);ctx.fill();
    ctx.save();ctx.scale(2.5,2.5);ctx.translate(-12,-12);ctx.strokeStyle=G;ctx.lineWidth=2;ctx.lineCap=ctx.lineJoin='round';
    ICONS[i].forEach(p=>ctx.stroke(p));ctx.restore()});
}
function wipes(t){
  for(const tw of WIPES){
    if(t<tw||t>tw+.95)continue;
    [[G,0,.09],[P,.09,0]].forEach(([c,din,dout])=>{
      const y=t<tw+.42?H*(1-EIO(cl((t-tw-din)/.32))):-H*EIO(cl((t-tw-.42-dout)/.32));
      ctx.fillStyle=c;ctx.fillRect(0,y,W,H)});
  }
}
function render(t){
  background(t);
  const s=t<S_START[1]?1:t<S_START[2]?2:t<S_START[3]?3:4;
  [null,scene1,scene2,scene3,scene4][s](t);
  wipes(t);
}

/* ================= Runner & export ================= */
let running=false;
async function prepare(){
  try{await Promise.all(['800 60px "Bahij TheSans"','800 60px "IBM Plex Sans Arabic"','800 60px Tajawal'].map(f=>document.fonts.load(f,'أكاديمية')))}catch(e){}
  if(!EMB){EMB=new Image();EMB.src=$('ov').querySelector('img').src;await EMB.decode()}
  initLayout();
}
async function run(record){
  if(running)return;running=true;
  await prepare();await initAudio();
  let rec,chunks=[],mime='',ext='webm';
  if(record){
    if(!window.MediaRecorder||!cv.captureStream){alert('المتصفح لا يدعم التصدير المباشر. استخدم Chrome أو Edge أو Safari حديثاً.');running=false;return}
    const types=['video/mp4;codecs=avc1.640028,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
    mime=types.find(t=>MediaRecorder.isTypeSupported(t))||'';ext=mime.includes('mp4')?'mp4':'webm';
    const stream=new MediaStream([...cv.captureStream(60).getVideoTracks(),...DEST.stream.getAudioTracks()]);
    rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:12e6,audioBitsPerSecond:192e3}:{videoBitsPerSecond:12e6});
    rec.ondataavailable=e=>e.data&&e.data.size&&chunks.push(e.data);
  }
  $('ov').classList.add('off');render(0);
  const t0=ac.currentTime+.25;scheduleAudio(t0);
  if(rec)rec.start(200);
  await new Promise(done=>{
    const loop=()=>{
      const t=Math.max(0,ac.currentTime-t0);render(t);
      if(record)$('status').textContent='جارٍ التصدير… '+Math.min(100,Math.round(t/END*100))+'%';
      t>END?done():requestAnimationFrame(loop)};
    loop();
  });
  if(rec){
    await wait(250);const stopped=new Promise(r=>rec.onstop=r);rec.stop();await stopped;
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:mime||'video/webm'}));
    a.download='ain-academy-critical-thinking-1080x1920.'+ext;document.body.append(a);a.click();a.remove();
    $('status').textContent='تم تنزيل الفيديو ('+ext.toUpperCase()+')';
  }else $('status').textContent='';
  $('bPlay').textContent='إعادة العرض';$('ov').classList.remove('off');running=false;
}
$('bPlay').onclick=()=>run(false);
$('bExp').onclick=()=>run(true);
addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R')run(false)});
prepare().then(()=>render(0));
</script>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أكاديمية عين | لماذا؟</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@600;700&family=Tajawal:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#153C4D;--p2:#1F566E;--g:#F59E0B;--bg:#F8FAFC;--e:cubic-bezier(0.34,1.56,0.64,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#E3E9EF;overflow:hidden;font-family:"Bahij TheSans","IBM Plex Sans Arabic",Tajawal,Tahoma,sans-serif;font-weight:800;color:var(--p)}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;overflow:hidden;background:var(--bg);border-radius:64px;box-shadow:0 50px 140px rgba(21,60,77,.35),0 0 0 14px #fff}
.shape{position:absolute;border-radius:50%}
#c1{width:560px;height:560px;background:var(--g);opacity:.14;top:-200px;left:-170px}
#c2{width:520px;height:520px;border:60px solid var(--p2);opacity:.07;bottom:-190px;right:-170px}
#c3{width:80px;height:80px;background:var(--g);bottom:220px;left:90px;animation:bob 3s ease-in-out infinite alternate}
#bar{position:absolute;top:0;right:0;height:16px;width:100%;background:linear-gradient(270deg,var(--p) 0 60%,var(--g) 60%)}
@keyframes bob{to{transform:translateY(-36px)}}
.scene{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 70px}
.scene.on{display:flex}
.pop{display:inline-block;opacity:0;transform:scale(0) rotate(-8deg);transition:transform .55s var(--e),opacity .15s}
.pop.in{opacity:1;transform:none}
#q{font-size:108px;line-height:1.55}
#q .pop{margin:0 .12em}
#q .hl{background:var(--g);color:var(--p);padding:0 .3em;border-radius:.4em}
#col{display:flex;flex-direction:column;align-items:center;gap:6px}
.pill{font-size:64px;padding:24px 64px;border-radius:100px;background:var(--p);color:#fff;box-shadow:0 16px 0 -6px rgba(21,60,77,.16)}
.pill.g{background:var(--g);color:var(--p);box-shadow:0 16px 0 -6px rgba(245,158,11,.25)}
.arr{font-size:70px;color:var(--g);line-height:1.1}
#l1{font-size:100px;line-height:1.55}#l1 .pop{margin:0 .12em}
#l2{margin-top:44px;font-size:112px;line-height:1.35;background:var(--p);color:#fff;padding:20px 50px 34px;border-radius:40px;box-shadow:14px 14px 0 var(--g)}
#l2 .pop{margin:0 .13em}
#emb{height:190px;display:block;max-width:900px}
#name{font-size:150px;line-height:1.2;margin-top:50px}
#sub{font-size:56px;color:var(--p2);margin-top:10px;font-weight:700}
#sub i{font-style:normal;color:var(--g);margin:0 .3em}
#soc{display:flex;gap:34px;margin-top:90px}
.ic{width:120px;height:120px;border-radius:50%;background:var(--p);display:grid;place-items:center}
.ic svg{width:60px;height:60px;fill:none;stroke:var(--g);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wp{position:absolute;inset:0;transform:translateY(105%);z-index:8;pointer-events:none}
#w1{background:var(--g)}#w2{background:var(--p)}
#start{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;gap:44px;align-items:center;justify-content:center;background:var(--bg);transition:opacity .4s}
#start.off{opacity:0;pointer-events:none}
button{font:inherit;font-weight:800;font-size:58px;color:#fff;background:var(--p);border:0;border-radius:100px;padding:30px 110px;cursor:pointer;box-shadow:0 14px 0 var(--g);transition:transform .15s,box-shadow .15s}
button:hover{transform:translateY(-4px)}button:active{transform:translateY(8px);box-shadow:0 4px 0 var(--g)}
button:focus-visible{outline:5px solid var(--g);outline-offset:8px}
#again{position:absolute;z-index:9;bottom:100px;left:0;right:0;margin:auto;width:fit-content;display:flex;flex-direction:column;gap:30px;align-items:stretch;opacity:0;pointer-events:none;transition:opacity .4s}
#again button{font-size:44px;padding:22px 70px;box-shadow:0 10px 0 var(--g)}
.alt{background:var(--g);color:var(--p);box-shadow:0 10px 0 var(--p)!important}
#again button.alt,#start button.alt{font-size:44px}
.rec #stage{border-radius:0;box-shadow:none}.rec #again{display:none}
#again.show{opacity:1;pointer-events:auto}
</style>
</head>

<script>
const $=id=>document.getElementById(id),wait=ms=>new Promise(r=>setTimeout(r,ms)),stage=$('stage');
const fit=()=>stage.style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/1080,innerHeight/1920)*(document.body.classList.contains('rec')?1:.92)})`;
addEventListener('resize',fit);fit();

/* ---- Web Audio SFX ---- */
let ac;let BUS,DEST;const A=()=>{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();BUS=ac.createGain();BUS.connect(ac.destination);DEST=ac.createMediaStreamDestination();BUS.connect(DEST)}if(ac.state==='suspended')ac.resume();return ac};
function env(g,t,peak,dur){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+dur)}
function pop(f=500,v=.22){const a=A(),t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type='sine';o.frequency.setValueAtTime(f*.6,t);o.frequency.exponentialRampToValueAtTime(f*1.8,t+.07);
  env(g,t,v,.16);o.connect(g).connect(BUS);o.start(t);o.stop(t+.2)}
function slam(){const a=A(),t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type='triangle';o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(45,t+.25);
  env(g,t,.5,.35);o.connect(g).connect(BUS);o.start(t);o.stop(t+.4);pop(900,.15)}
function swoosh(){const a=A(),t=a.currentTime,n=a.sampleRate*.5,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.Q.value=2;
  f.frequency.setValueAtTime(500,t);f.frequency.exponentialRampToValueAtTime(5000,t+.35);
  const g=a.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.22,t+.15);g.gain.linearRampToValueAtTime(0,t+.45);
  s.connect(f).connect(g).connect(BUS);s.start(t)}
function chime(){const a=A(),t=a.currentTime;[1047,1319,1568,2093].forEach((f,i)=>{
  const o=a.createOscillator(),g=a.createGain(),s=t+i*.09;o.type='sine';o.frequency.value=f;
  env(g,s,.16,1.3);o.connect(g).connect(BUS);o.start(s);o.stop(s+1.4)})}

/* ---- Build content ---- */
const span=(txt,cls='')=>{const s=document.createElement('span');s.className='pop '+cls;s.textContent=txt;return s};
const fill=(el,txt,hl)=>{txt.split(' ').forEach(w=>el.append(span(w,hl&&hl(w)?'hl':'')));return[...el.children]};
const qW=fill($('q'),'ماذا سيتغير عندما يتعلم اليافع أن يسأل «لماذا؟» بطريقة أفضل؟',w=>w.includes('لماذا'));
const l1W=fill($('l1'),'هذه ليست معلومات يحفظها…');
const l2W=fill($('l2'),'بل مهارات يمارسها');
const STEPS=['سيسأل','يحلل','يكتشف الافتراضات','يفحص الأدلة','يرى البدائل','يعيد التفكير'];
const items=[];
STEPS.forEach((t,i)=>{const row=$('col');
  const p=span(t,'pill'+(i%2?' g':''));row.append(p);items.push({el:p,pill:1});
  if(i<5){const a=span('↓','arr');row.append(a);items.push({el:a})}});

/* ---- Scene control ---- */
let run=0;
const show=id=>document.querySelectorAll('.scene').forEach(s=>s.classList.toggle('on',s.id===id));
async function go(id,ok){
  swoosh();
  for(const w of['w1','w2']){const e=$(w);e.style.transition='none';e.style.transform='translateY(105%)'}
  await wait(20);
  $('w1').style.transition='transform .32s cubic-bezier(.7,0,.3,1)';$('w1').style.transform='none';
  await wait(90);
  $('w2').style.transition='transform .32s cubic-bezier(.7,0,.3,1)';$('w2').style.transform='none';
  await wait(340);if(!ok())return;
  show(id);
  $('w1').style.transition=$('w2').style.transition='transform .34s cubic-bezier(.7,0,.3,1)';
  $('w1').style.transform=$('w2').style.transform='translateY(-105%)';
  await wait(200);
}
function reset(){document.querySelectorAll('.in').forEach(e=>e.classList.remove('in'));show('');$('again').classList.remove('show')}

async function play(){
  const id=++run,ok=()=>id===run;
  reset();A();$('start').classList.add('off');await wait(400);if(!ok())return;

  show('s1');
  for(const w of qW){w.classList.add('in');pop(420+Math.random()*250);if(w.classList.contains('hl')){await wait(60);slam()}await wait(w.classList.contains('hl')?420:230);if(!ok())return}
  await wait(1300);if(!ok())return;

  await go('s2',ok);if(!ok())return;
  let n=0;
  for(const it of items){it.el.classList.add('in');if(it.pill){pop(400+n*90,.25);n++;await wait(260)}else await wait(110);if(!ok())return}
  await wait(1400);if(!ok())return;

  await go('s3',ok);if(!ok())return;
  for(const w of l1W){w.classList.add('in');pop(500);await wait(260);if(!ok())return}
  await wait(350);
  for(const w of l2W){w.classList.add('in');slam();await wait(340);if(!ok())return}
  await wait(1700);if(!ok())return;

  await go('s4',ok);if(!ok())return;
  $('emb').classList.add('in');pop(600);await wait(280);
  $('name').classList.add('in');pop(700);await wait(260);
  $('sub').classList.add('in');pop(800);await wait(300);
  chime();
  for(const ic of document.querySelectorAll('.ic')){ic.classList.add('in');pop(900,.18);await wait(160);if(!ok())return}
  await wait(1200);$('again').classList.add('show');
}
$('play').onclick=play;$('again1').onclick=play;$('rec1').onclick=$('rec2').onclick=record;

/* ---- Record & download (Chrome/Edge: Region Capture + MediaRecorder) ---- */
let recording=false;
async function record(){
  if(recording)return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getDisplayMedia||!window.CropTarget||!window.MediaRecorder){
    alert('التسجيل التلقائي يتطلب متصفح Chrome أو Edge حديثاً على الحاسوب.');return}
  let stream;
  try{stream=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:30,cursor:'never'},audio:false,preferCurrentTab:true,selfBrowserSurface:'include'})}catch(e){return}
  recording=true;let aborted=false,raf,rec;
  const vt=stream.getVideoTracks()[0];
  const cleanup=()=>{cancelAnimationFrame(raf);stream.getTracks().forEach(t=>t.stop());document.body.classList.remove('rec');fit();document.title='أكاديمية عين | لماذا؟';recording=false};
  try{
    document.body.classList.add('rec');fit();document.title='● جارٍ التسجيل…';await wait(500);
    await vt.cropTo(await CropTarget.fromElement(stage));$('start').classList.add('off');$('again').classList.remove('show');reset();
    const v=document.createElement('video');v.muted=true;v.srcObject=stream;await v.play();await wait(700);
    const cv=document.createElement('canvas');cv.width=1080;cv.height=1920;const c=cv.getContext('2d');
    const draw=()=>{c.drawImage(v,0,0,1080,1920);raf=requestAnimationFrame(draw)};draw();
    A();
    const out=new MediaStream([...cv.captureStream(30).getVideoTracks(),...DEST.stream.getAudioTracks()]);
    const types=['video/mp4;codecs=avc1.640028,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
    const mime=types.find(t=>MediaRecorder.isTypeSupported(t))||'',ext=mime.includes('mp4')?'mp4':'webm';
    const chunks=[];rec=new MediaRecorder(out,{mimeType:mime,videoBitsPerSecond:14e6,audioBitsPerSecond:192e3});
    rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
    const stopped=new Promise(r=>rec.onstop=r);
    vt.onended=()=>{aborted=true;run++;if(rec.state!=='inactive')rec.stop()};
    rec.start(250);
    await play();await wait(900);
    if(rec.state!=='inactive')rec.stop();
    await stopped;
    if(!aborted){
      const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:mime||'video/webm'}));
      a.download='ain-academy-critical-thinking.'+ext;document.body.append(a);a.click();a.remove();
    }
  }catch(e){console.error(e);alert('تعذّر التسجيل. تأكد من اختيار «هذا التبويب» عند طلب المشاركة.')}
  cleanup();$('again').classList.add('show');
}
addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R')play()});
</script>
